[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "vektorcode"
version = "0.1.0"
description = "AI coding agent for the terminal"
readme = "README.md"
# 17 modules use PEP 604 `X | Y` unions; nothing needs 3.11+.
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Terrence Chuwe", email = "terrence.chuwe@cassava.ai" }]
keywords = ["ai", "agent", "cli", "coding-assistant", "llm"]
classifiers = [
    # Blocks accidental upload to PyPI, which rejects this classifier.
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

# Minimum pins, not exact — a CLI that runs alongside other projects must
# not force a specific patch release on anyone.
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/PAPA-CHUWE/vektorcode"
Repository = "https://github.com/PAPA-CHUWE/vektorcode"
Issues = "https://github.com/PAPA-CHUWE/vektorcode/issues"

[project.scripts]
vektorcode = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The skills are markdown loaded at runtime. Hatchling ships everything
# under a listed package, so they are included — the test below asserts it,
# because a wheel without them silently disables every skill.

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "README.md", "LICENSE", "pyproject.toml"]
